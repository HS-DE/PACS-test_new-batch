name: PACS adaptive export

on:
  push:
    branches: [pacs-adaptive-export-20260826]
    paths:
      - "script/export_adaptive_pacs.py"
      - ".github/workflows/pacs-adaptive-export.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: python -m pip install pandas numpy openpyxl

      - name: Generate before and after matrices
        run: python script/export_adaptive_pacs.py

      - name: Upload adaptive PACS matrices
        uses: actions/upload-artifact@v4
        with:
          name: pacs-adaptive-matrices
          path: adaptive_export/
          if-no-files-found: error
          retention-days: 30

# Trigger marker: fixed setup-python configuration
